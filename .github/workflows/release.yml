name: release

# 触发：push v* tag。tag 必须与 package.json.version 完全一致。
# 流水线：
#   check    → typecheck + test（gate；任何阶段挂掉就停下）
#   npm      → npm publish 到 npm 公共 registry（带 provenance attestation）
#   docker   → 构建 multi-arch (amd64+arm64) 镜像并推到 GHCR
#   release  → 用 git log 自动生成 changelog，建 GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # 建 GitHub Release
  packages: write     # 推 GHCR
  id-token: write     # npm provenance attestation（OIDC）

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  verify-version:
    name: verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag to package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) 与 package.json 版本 $PKG_VERSION 不一致"
            echo "解决方法：修改 package.json 后重新打 tag，或先 git tag -d $GITHUB_REF_NAME"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME 与 package.json $PKG_VERSION 一致"

  npm:
    name: publish to npm
    needs: [check, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Publish
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: build & push Docker image to GHCR
    needs: [check, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: create GitHub Release
    needs: [npm, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以生成 changelog

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## 安装"
            echo
            echo "**npm:**"
            echo
            echo '```bash'
            echo "npm install -g $(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo "**Docker:**"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:'- %s (%h)' HEAD
            else
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            fi
          } > RELEASE_NOTES.md
          echo "─── Generated RELEASE_NOTES.md ───"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
