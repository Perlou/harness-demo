name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  docker-smoke:
    name: docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 仅 build 不 push；验证 Dockerfile 在 main 分支始终是绿的。
      # CI 上不需要 multi-arch（push 阶段才需要）；这里只跑 amd64
      # 让 PR 反馈更快。
      - name: Build (linux/amd64 only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: harness-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          # 验证镜像可以启动并且 mode 子命令工作
          MODE=$(docker run --rm harness-demo:ci mode)
          if [ "$MODE" != "demo" ]; then
            echo "::error::expected 'demo', got '$MODE'"
            exit 1
          fi
          # 验证 --help 不崩
          docker run --rm harness-demo:ci --help > /dev/null
          # 验证 seed 在容器里能跑通（写到 ephemeral 容器内的 /app/data）
          docker run --rm \
            -e HARNESS_DB_PATH=/tmp/smoke.sqlite \
            harness-demo:ci seed | tail -5
